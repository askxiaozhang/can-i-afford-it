# 在 GitHub 上发布一个 Release 后，自动构建单文件版和 itch.io 压缩包，附到这个 Release 上
name: Release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要附加文件的 Release 标签（如 v0.1.0）
        required: true
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:itch
      - run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
